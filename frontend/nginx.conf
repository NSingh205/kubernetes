server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1) Normal pages: serve the file, or fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2) Anything starting with /api/ is handed to the PHP backend.
    #    "backend" is resolved by DNS (Docker now, Kubernetes Service later).
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
